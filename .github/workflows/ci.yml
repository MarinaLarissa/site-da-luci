name: CI - Translation Validation & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  frontend-validation:
    name: Frontend - Translation Keys & ESLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci --ignore-scripts

      - name: Validate translation keys
        working-directory: ./frontend
        run: npm run validate-i18n
        continue-on-error: false

      - name: Run ESLint
        working-directory: ./frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/build
          retention-days: 7

  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [frontend-validation]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment files
        run: |
          echo "Checking deployment configuration..."

          if [ -f "frontend/package.json" ]; then
            echo "Frontend package.json found"
          else
            echo "Frontend package.json missing"
            exit 1
          fi

          echo "All deployment files present"

      - name: Summary
        run: |
          echo "## CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Validations Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Translation keys validated (0 missing keys)" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint checks completed" >> $GITHUB_STEP_SUMMARY
          echo "- Build successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ready for deployment!**" >> $GITHUB_STEP_SUMMARY
