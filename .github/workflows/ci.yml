name: CI - Translation Validation & Linting

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  frontend-validation:
    name: Frontend - Translation Keys & ESLint
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Validate translation keys
        run: npm run validate-i18n
        continue-on-error: false

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          CI: true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/build
          retention-days: 7

  backend-tests:
    name: Backend - Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './backend/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage
        env:
          CI: true

      - name: Upload coverage reports
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ./backend/coverage
          retention-days: 7

  deployment-check:
    name: Deployment Readiness
    runs-on: ubuntu-latest
    needs: [frontend-validation, backend-tests]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check deployment files
        run: |
          echo "✅ Checking deployment configuration..."

          # Check frontend deployment
          if [ -f "frontend/package.json" ]; then
            echo "✅ Frontend package.json found"
          else
            echo "❌ Frontend package.json missing"
            exit 1
          fi

          # Check backend deployment
          if [ -f "backend/package.json" ]; then
            echo "✅ Backend package.json found"
          else
            echo "❌ Backend package.json missing"
            exit 1
          fi

          echo "✅ All deployment files present"

      - name: Summary
        run: |
          echo "## 🎉 CI Pipeline Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ✅ Validations Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Translation keys validated (0 missing keys)" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint checks completed" >> $GITHUB_STEP_SUMMARY
          echo "- Backend tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- Build successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Ready for deployment! 🚀**" >> $GITHUB_STEP_SUMMARY
